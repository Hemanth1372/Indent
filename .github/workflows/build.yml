name: IndentMate CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  NODE_VERSION: '22.x'

jobs:
  api:
    name: Build & Test API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: indentmate-api/package-lock.json

      - name: Install API dependencies
        working-directory: indentmate-api
        run: npm ci

      - name: Check API JavaScript syntax
        working-directory: indentmate-api
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          find src workbook-importers -name '*.js' -print0 | xargs -0 -r -n1 node --check

  web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: indentmate-web/package-lock.json

      - name: Install web dependencies
        working-directory: indentmate-web
        run: npm ci

      - name: Build web
        working-directory: indentmate-web
        run: npm run build

  package-api:
    name: Package API Artifact
    runs-on: ubuntu-latest
    needs: api
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create API artifact
        shell: bash
        run: |
          mkdir -p publish
          tar \
            --exclude='node_modules' \
            --exclude='.env' \
            -czf "publish/IndentMate-API-${GITHUB_SHA}.tar.gz" \
            indentmate-api

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: IndentMate-API-${{ github.sha }}
          path: publish/IndentMate-API-${{ github.sha }}.tar.gz
          retention-days: 30

      - name: Upload summary
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: IndentMate-API-${{ github.sha }}.tar.gz" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
