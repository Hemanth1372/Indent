name: IndentMate CI/CD

# Trigger on pushes to main and dev branches
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  DOTNET_VERSION: '10.0.x'
  API_PROJECT: 'IndentMate.API/IndentMate.API.csproj'
  SOLUTION: 'IndentMate.slnx'

jobs:
  # ─── Build & Test ─────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.API_PROJECT }}

      - name: Build IndentMate.API
        run: dotnet build ${{ env.API_PROJECT }} --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ${{ env.SOLUTION }} --no-build --configuration Release --verbosity normal
        # Note: No test project exists yet — this step will pass once tests are added.
        continue-on-error: true

  # ─── Publish (main branch only) ───────────────────────────────────────────
  publish:
    name: Publish API Artifact
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.API_PROJECT }}

      - name: Publish IndentMate.API
        run: |
          dotnet publish ${{ env.API_PROJECT }} \
            --configuration Release \
            --output ./publish/api \
            --no-restore

      - name: Zip published API
        run: |
          cd publish
          zip -r IndentMate-API-${{ github.sha }}.zip api/

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: IndentMate-API-${{ github.sha }}
          path: publish/IndentMate-API-${{ github.sha }}.zip
          retention-days: 30

      - name: Upload summary
        run: |
          echo "## ✅ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** IndentMate-API-${{ github.sha }}.zip" >> $GITHUB_STEP_SUMMARY
          echo "- **Published:** $(date -u)" >> $GITHUB_STEP_SUMMARY
